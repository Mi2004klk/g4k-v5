[build]
builder = "nixpacks"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "php84Extensions.pdo", "php84Extensions.pdo_pgsql", "php84Extensions.mbstring", "php84Extensions.bcmath", "php84Extensions.gd", "php84Extensions.redis"]

[phases.install]
cmds = ["cd apps/api 2>/dev/null || true; composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "cd apps/api 2>/dev/null || true; php artisan config:clear",
  "cd apps/api 2>/dev/null || true; php artisan route:clear",
  "cd apps/api 2>/dev/null || true; php artisan storage:link"
]

[start]
cmd = "cd apps/api 2>/dev/null || true; php artisan config:clear && php artisan route:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
