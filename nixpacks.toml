[build]
builder = "nixpacks"

[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "php84Extensions.pdo",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.mbstring",
  "php84Extensions.bcmath",
  "php84Extensions.gd",
  "php84Extensions.redis",
]

[phases.install]
cmds = ["cd apps/api && composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = ["cd apps/api && php artisan storage:link"]

[start]
cmd = "cd apps/api && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"