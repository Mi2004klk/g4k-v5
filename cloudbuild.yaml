  - name: 'google/cloud-sdk:slim'
    id: SmokeCheck
    entrypoint: 'sh'
    args: 
      - '-c'
      - |
        echo "Waiting for service to be fully ready..."
        sleep 5
        URL=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format="value(status.url)")
        echo "Curling $$URL/api/health"
        HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" "$$URL/api/health" || echo "000")
        if [ "$$HTTP_CODE" -ne 200 ]; then
          echo "Smoke check failed! HTTP status code: $$HTTP_CODE"
          exit 1
        fi
        echo "Curling $$URL/api/ping"
        PING_CODE=$$(curl -s -o /dev/null -w "%{http_code}" "$$URL/api/ping" || echo "000")
        if [ "$$PING_CODE" -ne 200 ]; then
          echo "Ping check failed! HTTP status code: $$PING_CODE"
          exit 1
        fi
        echo "Testing authenticated API endpoints for Admin, HR, Employee..."
        for USER in "g4kkarthik@gmail.com:Admin@123" "hr@games4king.in:Hr@123" "praveen@games4king.in:Dev@123"; do
          EMAIL=$$(echo $$USER | cut -d':' -f1)
          PASS=$$(echo $$USER | cut -d':' -f2)
          TOKEN=$$(curl -s -X POST "$$URL/api/auth/login" -H "Content-Type: application/json" -H "Accept: application/json" -d "{\"identifier\":\"$$EMAIL\",\"password\":\"$$PASS\"}" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -n "$$TOKEN" ]; then
            echo "Authenticated successfully as $$EMAIL"
            for ENDPOINT in "/api/dashboard/init" "/api/notifications" "/api/directory"; do
              DASH_RES=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN" -H "Accept: application/json" "$$URL$$ENDPOINT")
              if [ "$$DASH_RES" -ne 200 ]; then
                echo "Authenticated $$ENDPOINT check failed for $$EMAIL with code $$DASH_RES"
                exit 1
              fi
            done
          fi
        done
        echo "Authenticated smoke check passed cleanly!"
