# Build the API image and deploy to Cloud Run (asia-south1).
# Trigger: GitHub push to `main` (Cloud Build > Triggers).
substitutions:
  _SERVICE: g4k-api
  _REGION: asia-south1
  _DB_HOST: aws-0-ap-south-1.pooler.supabase.com
  _DB_USERNAME: postgres.jtcgtjrqijdnecwtuspv
  _SUPABASE_PROJECT_REF: jtcgtjrqijdnecwtuspv

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'ubuntu'
    id: SecurityAudit
    entrypoint: bash
    args:
      - '-c'
      - |
        if grep -rq "test-projects" apps/api/routes; then
          echo "ERROR: Found test-projects in routes! Aborting build."
          exit 1
        fi
        if [ -f "fix_test_route.php" ]; then
          echo "ERROR: fix_test_route.php still exists! Aborting build."
          exit 1
        fi

  - name: gcr.io/cloud-builders/docker
    id: Build
    args: ["build", "-f", "Dockerfile", "-t", "asia-south1-docker.pkg.dev/${PROJECT_ID}/g4k/${_SERVICE}:latest", "."]


  - name: gcr.io/cloud-builders/docker
    id: Push
    args: ["push", "asia-south1-docker.pkg.dev/${PROJECT_ID}/g4k/${_SERVICE}:latest"]


  - name: gcr.io/cloud-builders/docker
    id: Migrate
    entrypoint: bash
    args:
      - '-c'
      - |
        docker run --env=DB_CONNECTION=pgsql --env=DB_HOST=${_DB_HOST} --env=DB_PORT=5432 --env=DB_DATABASE=postgres --env=DB_USERNAME=${_DB_USERNAME} --env DB_PASSWORD --env=DB_SSLMODE=require asia-south1-docker.pkg.dev/${PROJECT_ID}/g4k/${_SERVICE}:latest php artisan migrate --force
    secretEnv: ['DB_PASSWORD']

  - name: gcr.io/cloud-builders/docker
    id: MigrateStatus
    entrypoint: bash
    args:
      - '-c'
      - |
        OUTPUT=$$(docker run --env=DB_CONNECTION=pgsql --env=DB_HOST=${_DB_HOST} --env=DB_PORT=5432 --env=DB_DATABASE=postgres --env=DB_USERNAME=${_DB_USERNAME} --env DB_PASSWORD --env=DB_SSLMODE=require asia-south1-docker.pkg.dev/${PROJECT_ID}/g4k/${_SERVICE}:latest php artisan migrate:status)
        echo "$$OUTPUT"
        if echo "$$OUTPUT" | grep -q "Pending"; then
          echo "ERROR: There are pending migrations!"
          exit 1
        fi
    secretEnv: ['DB_PASSWORD']

  - name: google/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=asia-south1-docker.pkg.dev/${PROJECT_ID}/g4k/${_SERVICE}:latest
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --cpu-boost
      - --concurrency=10
      - --min-instances=1
      - --max-instances=10
      - --timeout=300
      - --no-use-http2
      - --remove-secrets=PUSHER_APP_ID,PUSHER_APP_CLUSTER
      - --update-env-vars=APP_NAME=Games4King,APP_ENV=production,APP_DEBUG=false,APP_LOCALE=en,APP_MAINTENANCE_DRIVER=cache,APP_MAINTENANCE_STORE=database,BCRYPT_ROUNDS=12,LOG_CHANNEL=stderr,LOG_LEVEL=error,DB_CONNECTION=pgsql,DB_SSLMODE=require,DB_PORT=5432,DB_HOST=${_DB_HOST},DB_DATABASE=postgres,DB_USERNAME=${_DB_USERNAME},SESSION_DRIVER=database,CACHE_STORE=database,QUEUE_CONNECTION=database,FILESYSTEM_DISK=s3,BROADCAST_CONNECTION=pusher,AWS_DEFAULT_REGION=ap-south-1,AWS_USE_PATH_STYLE_ENDPOINT=false,OCTANE_HTTPS=true,OCTANE_SERVER=frankenphp
      - --update-env-vars=AWS_ENDPOINT=https://${_SUPABASE_PROJECT_REF}.storage.supabase.co/storage/v1/s3,AWS_BUCKET=g4k,AWS_URL=https://${_SUPABASE_PROJECT_REF}.supabase.co/storage/v1/object/public/g4k,SUPABASE_URL=https://${_SUPABASE_PROJECT_REF}.supabase.co,PUSHER_APP_CLUSTER=ap2,PUSHER_APP_ID=2187569,FRONTEND_URL=https://g4k-v5.vercel.app,APP_URL=https://g4k-v5.vercel.app,SANCTUM_STATEFUL_DOMAINS=g4k-v5.vercel.app,TRUSTED_PROXIES=*
      - --update-secrets=APP_KEY=APP_KEY:latest,DB_PASSWORD=DB_PASSWORD:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest,PUSHER_APP_KEY=PUSHER_APP_KEY:latest,PUSHER_APP_SECRET=PUSHER_APP_SECRET:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest

  - name: google/cloud-sdk:slim
    id: DeployWorker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - g4k-worker
      - --image=asia-south1-docker.pkg.dev/${PROJECT_ID}/g4k/${_SERVICE}:latest
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --min-instances=1
      - --max-instances=2
      - --command=sh
      - --args=start-worker.sh
      - --remove-secrets=PUSHER_APP_ID,PUSHER_APP_CLUSTER
      - --update-env-vars=APP_NAME=Games4King,APP_ENV=production,APP_DEBUG=false,APP_LOCALE=en,APP_MAINTENANCE_DRIVER=cache,APP_MAINTENANCE_STORE=database,BCRYPT_ROUNDS=12,LOG_CHANNEL=stderr,LOG_LEVEL=error,DB_CONNECTION=pgsql,DB_SSLMODE=require,DB_PORT=5432,DB_HOST=${_DB_HOST},DB_DATABASE=postgres,DB_USERNAME=${_DB_USERNAME},SESSION_DRIVER=database,CACHE_STORE=database,QUEUE_CONNECTION=database,FILESYSTEM_DISK=s3,BROADCAST_CONNECTION=pusher,AWS_DEFAULT_REGION=ap-south-1,AWS_USE_PATH_STYLE_ENDPOINT=false,OCTANE_HTTPS=true,OCTANE_SERVER=frankenphp
      - --update-env-vars=AWS_ENDPOINT=https://${_SUPABASE_PROJECT_REF}.storage.supabase.co/storage/v1/s3,AWS_BUCKET=g4k,AWS_URL=https://${_SUPABASE_PROJECT_REF}.supabase.co/storage/v1/object/public/g4k,SUPABASE_URL=https://${_SUPABASE_PROJECT_REF}.supabase.co,PUSHER_APP_CLUSTER=ap2,PUSHER_APP_ID=2187569,FRONTEND_URL=https://g4k-v5.vercel.app,APP_URL=https://g4k-v5.vercel.app,SANCTUM_STATEFUL_DOMAINS=g4k-v5.vercel.app,TRUSTED_PROXIES=*
      - --update-secrets=APP_KEY=APP_KEY:latest,DB_PASSWORD=DB_PASSWORD:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest,PUSHER_APP_KEY=PUSHER_APP_KEY:latest,PUSHER_APP_SECRET=PUSHER_APP_SECRET:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest

  - name: 'google/cloud-sdk:slim'
    id: SmokeCheck
    entrypoint: 'sh'
    args: 
      - '-c'
      - |
        echo "Waiting for service to be fully ready..."
        sleep 5
        URL=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format="value(status.url)")
        
        echo "Curling $$URL/api/health"
        MAX_RETRIES=6
        RETRY_COUNT=0
        HTTP_CODE="000"
        
        while [ $$RETRY_COUNT -lt $$MAX_RETRIES ]; do
          HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" "$$URL/api/health" || echo "000")
          if [ "$$HTTP_CODE" -eq 200 ]; then
            echo "Health check passed!"
            break
          fi
          echo "Health check returned $$HTTP_CODE. Waiting 10s before retry..."
          sleep 10
          RETRY_COUNT=$$((RETRY_COUNT+1))
        done
        
        if [ "$$HTTP_CODE" -ne 200 ]; then
          echo "Smoke check failed after retries! HTTP status code: $$HTTP_CODE"
          exit 1
        fi
        
        echo "Curling $$URL/api/ping"
        PING_CODE=$$(curl -s -o /dev/null -w "%{http_code}" "$$URL/api/ping" || echo "000")
        if [ "$$PING_CODE" -ne 200 ]; then
          echo "Ping check failed! HTTP status code: $$PING_CODE"
          exit 1
        fi
        
        echo "Running authenticated smoke tests..."
        
        test_role() {
          local role=$$1
          local email=$$2
          local pass=$$3
          
          if [ -z "$$email" ] || [ -z "$$pass" ]; then
            echo "Skipping $$role smoke test: credentials not set in Secret Manager."
            return 0
          fi
          
          echo "Testing role: $$role ($$email)"
          
          # Login
          TOKEN=$$(curl -s -X POST "$$URL/api/auth/login" -H "Content-Type: application/json" -d "{\"email\":\"$$email\",\"password\":\"$$pass\"}" | python3 -c "import sys, json; print(json.load(sys.stdin).get('token', ''))")
            
          if [ -z "$$TOKEN" ]; then
            echo "Failed to get auth token for $$role!"
            exit 1
          fi
          
          endpoints="/api/dashboard/init /api/notifications /api/directory /api/conversations"
          if [ "$$role" = "admin" ]; then
            endpoints="$$endpoints /api/admin/jobs"
          fi
          
          for endpoint in $$endpoints; do
            echo "Curling $$URL$$endpoint"
            STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN" "$$URL$$endpoint")
            if [ "$$STATUS" -ne 200 ]; then
              echo "Smoke check failed for $$role on $$endpoint! Status: $$STATUS"
              exit 1
            fi
          done
        }
        
        test_role "admin" "$$SMOKE_ADMIN_EMAIL" "$$SMOKE_ADMIN_PASSWORD"
        test_role "hr" "$$SMOKE_HR_EMAIL" "$$SMOKE_HR_PASSWORD"
        test_role "employee" "$$SMOKE_EMP_EMAIL" "$$SMOKE_EMP_PASSWORD"
        
        echo "All smoke tests passed."

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/DB_PASSWORD/versions/latest
    env: 'DB_PASSWORD'
