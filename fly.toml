app = "g4k"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_LOCALE = "en"
  LOG_CHANNEL = "stack"
  LOG_LEVEL = "error"
  DB_CONNECTION = "pgsql"
  DB_PORT = "6543"
  DB_SSLMODE = "require"
  SESSION_DRIVER = "database"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "database"
  BROADCAST_CONNECTION = "reverb"
  FILESYSTEM_DISK = "local"
  REVERB_PORT = "443"
  REVERB_SCHEME = "https"
  REVERB_SERVER_HOST = "0.0.0.0"
  REVERB_SERVER_PORT = "8080"
  AWS_DEFAULT_REGION = "ap-south-1"
  AWS_USE_PATH_STYLE_ENDPOINT = "false"
  BCRYPT_ROUNDS = "12"
  PHP_INI_SCAN_DIR = "/var/www/html/apps/api"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/ping"

[[services]]
  internal_port = 8081
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 8443

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
