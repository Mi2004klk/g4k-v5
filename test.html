<!DOCTYPE html>
<html>
<head>
  <title>Pusher Test</title>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <script>
    // Enable pusher logging - don't include this in production
    Pusher.logToConsole = true;

    var pusher = new Pusher('e381a9c6a50fe719f8af', {
      cluster: 'ap2'
    });

    var channel = pusher.subscribe('my-channel');
    channel.bind('my-event', function(data) {
      alert("PUSHER EVENT RECEIVED:\n" + JSON.stringify(data));
      console.log("Pusher Event:", data);
    });
  </script>
</head>
<body>
  <h1>Pusher Verification Page</h1>
  <p>
    This page is listening for events on <code>my-channel</code>.
  </p>

    Waiting for <code>my-event</code>...
  </p>
  <button onclick="window.open('https://g4k-api-579515345084.asia-south1.run.app/api/test-pusher', '_blank')">
    Trigger Test Route!
  </button>
</body>
</html>
