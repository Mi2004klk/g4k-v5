schema: spec-driven

context: |
  Product: Games4King Workplace OS — enterprise company-management platform.
  3 system roles: Super Admin, HR, Employee (the 15 "roles" in seed data are designations/job titles, not permission roles).
  Single-company deployment. Milestone 1 = Web only (Next.js), production-ready, responsive + PWA + offline.
  Read FIRST: openspec/README.md (orientation) -> openspec/project.md (architecture, ADRs,
  contracts, glossary) -> openspec/REQUIREMENTS.md (every functional WHAT, by REQ ID) ->
  openspec/TRACKER.md (build status, dependencies, acceptance criteria, verification
  checklists) -> the relevant phase folder under openspec/changes/phase-XX-*.

  Tech stack:
    Backend: Laravel 12, PHP 8.4+, PostgreSQL (Supabase), spec-first OpenAPI, Sanctum Bearer tokens, Laravel Reverb (realtime), queues/scheduler/events.
    Frontend: Next.js 16.2.12 + React + TypeScript, Tailwind v4, Radix + shadcn/ui (owned), TanStack Query + TanStack Table, Zustand (UI only), dnd-kit + React Grid Layout (never mixed), React Hook Form + Zod, ECharts, Tiptap, Lucide, Motion, IndexedDB.
    Shared: packages/ui (components, hooks, api-client, theme, types, design system) — consumed by apps/web (M1) and future Tauri desktop (M2, plain React SPA, no Next.js).
  Repo: monorepo apps/web + apps/api + packages/ui. Deploy: Railway (api) + Vercel (web) + Supabase (db) + GitHub.

  Non-negotiable principles: offline-first (one shared Offline Engine), API-first/spec-first,
  capability-based permissions only (backend decides), reusable components first (build a
  generic Metric Widget, not an Attendance Widget), no business logic in frontend, no client
  touches DB. ADRs govern stable contracts — changing one requires a new ADR.
  No AI product features in M1 ("AI-first" is a development methodology).
  Design: vibrant but professional (ClickUp energy, disciplined semantic data colors); brand purple/magenta/gold as accents; English only.

  Conventions: conventional commits; OpenAPI spec written before any route; every feature gets tests + doc updates.

  HARD RULES (non-negotiable):
    - NO mock/placeholder/sample data, ever. Screens with no data show their REAL empty state
      (see DESIGN-SYSTEM.md §14). Everything must be fully functional even when empty — real
      API calls, real mutations, real empty/loading/error states. Never hardcode fake numbers,
      dummy rows, or "Lorem ipsum". If a widget has no data source yet, it shows its true empty
      state, not a mock.
    - Design system is FROZEN in openspec/DESIGN-SYSTEM.md — implement exact tokens; deviations
      require a recorded decision.
    - Sidebar collapse/expand, logo placement, and dashboard widgets follow DESIGN-SYSTEM.md §9/§10/§13.

rules:
  proposal:
    - Keep under 600 words.
    - Always include "Non-goals" listing what this change explicitly defers.
    - Reference the phase number and capability name from docs/ROADMAP.md.
    - State which ADRs (if any) it depends on or introduces.
  specs:
    - Write requirements as "The system SHALL ..." statements (deltas vs the main spec, not a rewrite).
    - Group by capability area; one spec file per capability under specs/<capability>/spec.md.
    - Every requirement must be testable.
    - Call out offline behavior and capability gates where relevant.
    - Include performance requirements as SHALL statements referencing R13.x / P-* IDs (e.g., "list endpoint p95 SHALL be ≤200ms").
  design:
    - 'Include: data model (key tables/columns + indexes), API endpoints (OpenAPI refs + p95/queue notes), realtime channels, offline/sync notes, capability matrix additions.'
    - Reuse existing components/engines before proposing new ones.
    - Note any new ADR needed; do not silently change a stable contract.
    - Include a "## Performance Requirements" section citing R13.x/P-* with phase-specific measurable targets; name frequent workflows and their click/latency budgets; specify indexes, query budgets, caching staleTime, virtualization, optimistic-UI, and error-boundary coverage.
    - 'Include a "## Component mapping" section citing exact components from openspec/COMPONENT-SYSTEM.md (FROZEN) for each screen/workflow in the phase; compose only from that catalog (no ad-hoc UI). Module composites live in apps/web and compose packages/ui generics.'
  tasks:
    - Break into chunks of approximately 2 hours each.
    - Order tasks so the phase is independently testable and deployable.
    - 'Tag each task: [api] [web] [ui-pkg] [spec] [test] [seed] [deploy] [docs].'
    - End every phase with test + deploy + spec-archive tasks.
    - Include explicit [test] tasks for performance budgets (bundle/Lighthouse CI, query-count, render-count, virtualization, click-count on frequent workflows).

operations:
  apply:
    guidance:
      - Write the OpenAPI spec before implementing any backend route.
      - Run lint + tests for each task before marking it done; report real results.
      - Never add mock/placeholder data — render real empty states for empty data.
      - Add indexes with every new filtered/joined/ordered column; add query-count tests for list endpoints.
      - Virtualize any list >100 rows; add per-widget error boundaries; prefer skeletons over spinners.
      - Deploy the phase to staging, then production, before archiving the spec.
      - A performance-budget regression fails the apply — fix before proceeding.
  archive:
    guidance:
      - Confirm the phase is deployed and seeded before freezing the spec.
      - Confirm performance budgets are green and field metrics within p75 targets for the new flows.
      - Summarize what shipped, what was deferred, any ADRs added/changed, and record a performance-notes section (budgets met, any breaches + remediation).
