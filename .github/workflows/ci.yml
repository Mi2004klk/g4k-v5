name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  openapi-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint OpenAPI Spec
        run: npx @redocly/cli lint apps/api/openapi/openapi.yaml

  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install
      - name: Lint & Typecheck
        run: |
          pnpm --filter web lint
          pnpm --filter web typecheck
      - name: Run Web Tests
        run: pnpm --filter web test
      - name: Build Next.js App
        run: pnpm --filter web build
      - name: Check Bundle Size Budgets
        run: pnpm --filter web run test:bundle
      - name: Audit Dependencies
        run: pnpm audit --prod

  api-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g4k_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: g4k_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Security - No Backdoor Routes
        run: |
          if grep -r "test-projects" apps/api/routes; then
            echo "ERROR: Found test-projects in routes!"
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, bcmath, sqlite3
      - name: Install dependencies
        working-directory: ./apps/api
        run: composer install --prefer-dist --no-progress
      - name: Audit Dependencies
        working-directory: ./apps/api
        run: composer audit
      - name: Run Migrations
        working-directory: ./apps/api
        run: php artisan migrate --force
      - name: Remove SQLite pin for Postgres tests
        if: matrix.db == 'pgsql'
        working-directory: ./apps/api
        run: |
          sed -i '/DB_CONNECTION/d' phpunit.xml
          sed -i '/DB_DATABASE/d' phpunit.xml
      - name: Run Tests
        working-directory: ./apps/api
        run: php artisan test
