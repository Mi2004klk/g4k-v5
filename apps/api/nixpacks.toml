# Nixpacks build configuration for Laravel 13 (PHP 8.4) on Railway.
# IMPORTANT: composer.json requires "php": "^8.4". The PHP package MUST match.
[build]
builder = "nixpacks"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "php84Extensions.pdo", "php84Extensions.pdo_pgsql", "php84Extensions.mbstring", "php84Extensions.bcmath", "php84Extensions.gd", "php84Extensions.redis"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "php artisan config:clear",
  "php artisan route:clear",
  "php artisan view:clear",
  "php artisan storage:link"
]

# Runtime: clear caches, run migrations with runtime env vars, then start Laravel server
[start]
cmd = "php artisan config:clear && php artisan route:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
