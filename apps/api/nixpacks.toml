# Nixpacks config — used ONLY if Railway's service "Root Directory" is set to apps/api.
# If Railway root is the repo root, the top-level nixpacks.toml is used instead.
# Keep these two files in sync. composer.json requires "php": "^8.4".
[build]
builder = "nixpacks"

[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "php84Extensions.pdo",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.mbstring",
  "php84Extensions.bcmath",
  "php84Extensions.gd",
  "php84Extensions.redis",
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

# storage:link only at build (env not available; cache built at runtime).
[phases.build]
cmds = ["php artisan storage:link"]

# Runtime: build fresh cache with real env, migrate, serve.
[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
